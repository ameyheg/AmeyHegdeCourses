<style>
/* Layout: a navy masthead band with the catalogue mosaic, then a card grid of courses; each course opens its own page in the course's colour, with the player and lesson list side by side. */
:root {
  --bg: #FFF7EC; --surface: #FFFFFF; --sunk: #FBEFDD; --ink: #1F2A44; --mute: #5B6382; --line: #EADCC4;
  --accent: #F4A024; --accent-ink: #9E5800; --on-accent: #1F2A44;
  --band: #1F2A44; --band-ink: #FFF7EC; --band-mute: #B9C0D6; --band-line: rgba(255,247,236,.16);
  --shadow: 0 1px 2px rgba(31,42,68,.06), 0 12px 32px rgba(31,42,68,.10);
  --display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --body: "Hind", "Segoe UI", system-ui, sans-serif;
  --r: 16px; --max: 1180px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1424; --surface: #161F36; --sunk: #121A2E; --ink: #F3ECE0; --mute: #A3ABC4; --line: #26314F;
  --accent-ink: #FFC164; --band: #131B30; --band-ink: #F3ECE0; --band-mute: #9FA8C2; --band-line: rgba(243,236,224,.12);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E1424; --surface: #161F36; --sunk: #121A2E; --ink: #F3ECE0; --mute: #A3ABC4; --line: #26314F;
  --accent-ink: #FFC164; --band: #131B30; --band-ink: #F3ECE0; --band-mute: #9FA8C2; --band-line: rgba(243,236,224,.12);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
a { color: inherit; }
img, svg { max-width: 100%; }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -.015em; }
p { margin: 0; }
.wrap { max-width: var(--max); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 720px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.btn { display: inline-flex; align-items: center; gap: 10px; font: 600 16px/1 var(--display); padding: 15px 22px; border-radius: 999px; text-decoration: none; border: 0; cursor: pointer; transition: transform .15s ease, background .15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px currentColor; }
.btn svg { width: 18px; height: 18px; flex: none; }
.eyebrow { font: 600 13px/1.3 var(--display); letter-spacing: .12em; text-transform: uppercase; }

/* masthead */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--band); color: var(--band-ink); border-bottom: 1px solid var(--band-line); }
.top .wrap { display: flex; align-items: center; gap: 24px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; min-width: 0; }
.brand .mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand .mark svg { width: 16px; height: 16px; margin-left: 2px; }
.brand b { font: 700 17px/1.1 var(--display); display: block; letter-spacing: -.01em; }
.brand small { font: 500 12px/1.2 var(--display); color: var(--band-mute); letter-spacing: .04em; }
.top nav { display: flex; gap: 22px; font: 500 15px/1 var(--display); }
.top nav a { text-decoration: none; color: var(--band-mute); }
.top nav a:hover { color: var(--band-ink); }
.top .site { font: 600 14px/1 var(--display); text-decoration: none; padding: 10px 14px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--band-line); white-space: nowrap; }
@media (max-width: 860px) { .top nav { display: none; } }
@media (max-width: 420px) { .top .site { display: none; } }

/* home hero */
.hero { background: var(--band); color: var(--band-ink); overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 56px; align-items: center; padding-block: 64px 72px; }
.hero h1 { font-size: clamp(36px, 5.2vw, 62px); font-weight: 800; letter-spacing: -.03em; line-height: 1.04; margin: 18px 0 22px; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lede { color: var(--band-mute); font-size: 19px; max-width: 34em; }
.hero .eyebrow { color: var(--accent); }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-top: 44px; border-top: 1px solid var(--band-line); padding-top: 22px; max-width: 560px; }
.stats div { padding-right: 12px; }
.stats b { display: block; font: 700 28px/1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stats span { display: block; margin-top: 8px; font-size: 14px; line-height: 1.3; color: var(--band-mute); }
.continue { display: inline-flex; align-items: center; gap: 12px; margin-top: 18px; padding: 10px 16px 10px 10px; border-radius: 999px; background: rgba(244,160,36,.14); color: var(--band-ink); text-decoration: none; font: 500 15px/1.3 var(--display); }
.continue i { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: none; }
.continue i svg { width: 12px; height: 12px; margin-left: 2px; }
.mosaic { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; transform: rotate(-4deg) translateX(4%); }
.mosaic a { display: block; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,.35); transition: transform .25s ease; }
.mosaic a:nth-child(3n+2) { transform: translateY(18px); }
.mosaic a:hover { transform: translateY(-4px) scale(1.03); z-index: 2; }
.mosaic a:nth-child(3n+2):hover { transform: translateY(14px) scale(1.03); }
.mosaic svg { display: block; width: 100%; height: 100%; }
.mosaic span { position: absolute; left: 8px; bottom: 8px; right: 8px; font: 600 11px/1.2 var(--display); color: #FFF7EC; background: rgba(15,20,36,.72); padding: 5px 8px; border-radius: 6px; width: fit-content; max-width: calc(100% - 16px); }
@media (max-width: 960px) { .hero .wrap { grid-template-columns: minmax(0, 1fr); gap: 40px; padding-block: 44px 56px; } .mosaic { transform: none; } .mosaic a:nth-child(3n+2) { transform: none; } }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 20px; } .mosaic span { display: none; } .mosaic { gap: 8px; } }

/* sections */
section { padding-block: 72px; }
.sechead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 18px 28px; margin-bottom: 30px; }
.sechead h2 { font-size: clamp(28px, 3.4vw, 40px); font-weight: 800; letter-spacing: -.025em; }
.sechead p { color: var(--mute); max-width: 36em; margin-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 14px/1 var(--display); padding: 10px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 28px 24px; }
.card { display: flex; flex-direction: column; text-decoration: none; color: inherit; background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); transition: transform .2s ease, box-shadow .2s ease; }
.card:hover { transform: translateY(-4px); }
.card .cv { aspect-ratio: 16/9; overflow: hidden; }
.card .cv svg { display: block; width: 100%; height: 100%; transition: transform .5s ease; }
.card:hover .cv svg { transform: scale(1.05); }
.card .bd { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.tag { display: flex; align-items: center; gap: 8px; color: var(--mute); }
.tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 0 1.5px var(--surface), 0 0 0 2.5px var(--line); }
.card h3 { font-size: 20px; font-weight: 700; margin-top: 4px; }
.card .sub { color: var(--mute); font-size: 16px; line-height: 1.4; }
.meta { margin-top: auto; padding-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font: 500 14px/1.2 var(--display); color: var(--mute); font-variant-numeric: tabular-nums; }
.meta .who { margin-left: auto; color: var(--ink); background: var(--sunk); padding: 6px 10px; border-radius: 999px; font-size: 13px; }
.empty { color: var(--mute); }

/* how it works */
.how { background: var(--sunk); }
.how ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.how li { display: flex; flex-direction: column; gap: 10px; }
.how .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow); color: var(--accent-ink); }
.how .ic svg { width: 24px; height: 24px; }
.how h3 { font-size: 20px; font-weight: 700; margin-top: 8px; }
.how p { color: var(--mute); max-width: 30em; }
@media (max-width: 760px) { .how ul { grid-template-columns: minmax(0, 1fr); } }

/* people */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 16px; }
.person { display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: var(--r); border: 1px solid var(--line); text-decoration: none; transition: border-color .2s ease, transform .2s ease; }
.person:hover { border-color: var(--c); transform: translateY(-2px); }
.person .av { width: 52px; height: 52px; border-radius: 50%; background: var(--c); color: var(--ci); display: grid; place-items: center; font: 800 22px/1 var(--display); margin-bottom: 8px; }
.person b { font: 700 18px/1.2 var(--display); }
.person span { color: var(--mute); font-size: 15px; line-height: 1.4; }
.person small { margin-top: auto; padding-top: 10px; font: 600 13px/1.3 var(--display); color: var(--accent-ink); }

/* about */
.about { border-top: 1px solid var(--line); }
.about .wrap { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 48px; align-items: start; }
.about p { color: var(--mute); max-width: 36em; }
.about p + p { margin-top: 14px; }
.about .btn { margin-top: 24px; }
@media (max-width: 760px) { .about .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
footer { background: var(--band); color: var(--band-mute); font-size: 15px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; padding-block: 28px; }
footer a { color: var(--band-ink); }

/* course page */
.chero { background: var(--c); color: var(--ci); overflow: hidden; }
.chero .wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 48px; align-items: center; padding-block: 36px 56px; }
.back { display: inline-flex; align-items: center; gap: 8px; font: 500 15px/1 var(--display); text-decoration: none; opacity: .85; margin-bottom: 26px; }
.back:hover { opacity: 1; }
.back svg { width: 16px; height: 16px; }
.chero .eyebrow { opacity: .8; }
.chero h1 { font-size: clamp(32px, 4.6vw, 56px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin: 14px 0 12px; }
.chero .sub { font: 500 clamp(18px, 2vw, 22px)/1.35 var(--display); opacity: .85; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.facts span { font: 500 14px/1 var(--display); padding: 9px 13px; border-radius: 999px; box-shadow: inset 0 0 0 1px currentColor; opacity: .9; font-variant-numeric: tabular-nums; }
.chero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.chero .btn.primary { background: var(--ci); color: var(--c); }
.chero .bigcv { border-radius: 18px; overflow: hidden; aspect-ratio: 16/9; box-shadow: 0 24px 60px rgba(0,0,0,.35); transform: rotate(2deg); }
.chero .bigcv svg { display: block; width: 100%; height: 100%; }
@media (max-width: 900px) { .chero .wrap { grid-template-columns: minmax(0, 1fr); gap: 28px; } .chero .bigcv { display: none; } }
.watch { padding-block: 40px 24px; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 24px; align-items: start; }
@media (max-width: 960px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.player { position: relative; aspect-ratio: 16/9; border-radius: var(--r); overflow: hidden; background: #0B101D; box-shadow: var(--shadow); }
.player iframe, .player #yt, .player #yt > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.poster { position: absolute; inset: 0; display: block; border: 0; padding: 0; margin: 0; background: none; cursor: pointer; color: #FFF7EC; text-decoration: none; text-align: left; }
.poster svg.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: saturate(.9) brightness(.62); transition: filter .3s ease; }
.poster:hover svg.art { filter: saturate(1) brightness(.7); }
.poster .pl { position: absolute; left: 50%; top: 50%; width: 88px; height: 88px; margin: -44px 0 0 -44px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); transition: transform .2s ease; }
.poster:hover .pl { transform: scale(1.06); }
.poster .pl svg { width: 30px; height: 30px; margin-left: 5px; }
.poster .cap { position: absolute; left: 22px; right: 22px; bottom: 20px; font: 600 16px/1.3 var(--display); text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.poster .cap small { display: block; font: 500 13px/1.3 var(--display); opacity: .8; margin-bottom: 4px; letter-spacing: .06em; text-transform: uppercase; }
@media (max-width: 600px) {
  .poster .pl { width: 60px; height: 60px; margin: -30px 0 0 -30px; top: 36%; }
  .poster .pl svg { width: 22px; height: 22px; margin-left: 4px; }
  .poster .cap { left: 16px; right: 16px; bottom: 14px; font-size: 14px; }
  .poster .cap br, .poster .cap br + small { display: none; }
}
.panel { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: min(640px, 80vh); }
.panel .ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }

.panel .ph span { font: 500 14px/1 var(--display); color: var(--mute); }
.lang { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--sunk); }
.lang button { font: 600 13px/1 var(--display); border: 0; background: none; color: var(--mute); padding: 8px 12px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.lessons { list-style: none; margin: 0; padding: 8px; overflow-y: auto; }
.lessons li > * { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 11px 12px; border-radius: 12px; border: 0; background: none; color: inherit; text-align: left; text-decoration: none; font: inherit; cursor: pointer; }
.lessons li > *:hover { background: var(--sunk); }
.lessons .n { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font: 600 13px/1 var(--display); background: var(--sunk); color: var(--mute); font-variant-numeric: tabular-nums; }
.lessons .t { font: 500 15px/1.35 var(--display); }
.lessons .t small { display: block; margin-top: 3px; font: 400 13px/1.4 var(--body); color: var(--mute); }
.lessons .d { font: 500 13px/1 var(--display); color: var(--mute); font-variant-numeric: tabular-nums; }
.lessons li.on > * { background: var(--sunk); }
.lessons li.on .n { background: var(--accent); color: var(--on-accent); }
.lessons [lang="hi"] .t { font-family: var(--body); font-size: 16px; }
.inside { margin: 0; padding: 8px 20px 20px; }
.inside div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.inside dt { color: var(--mute); }
.inside dd { margin: 0; font: 500 15px/1.4 var(--display); text-align: right; }
.inside + p { padding: 0 20px 20px; color: var(--mute); font-size: 15px; line-height: 1.5; }
.note { margin-top: 12px; font-size: 14px; color: var(--mute); }
.story { padding-block: 40px 72px; }
.story .wrap { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 48px; }
.story p { font-size: 19px; line-height: 1.6; max-width: 36em; }
.story p + p { margin-top: 16px; color: var(--mute); font-size: 18px; }
@media (max-width: 760px) { .story .wrap { grid-template-columns: minmax(0, 1fr); gap: 14px; } }
.more { border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } html { scroll-behavior: auto; } }
</style>

      </div>
    </div>
    <div class="mosaic" aria-label="All courses">${courses.map(c => `<a href="#course-${c.slug}" aria-label="${esc(c.title)}">${c.cover}<span>${esc(c.title)}</span></a>`).join('')}</div>
  </div></div>

  <section id="courses"><div class="wrap">
    <div class="sechead">
      <div><h2>${WORDS[courses.length] || courses.length} courses, all free</h2><p>Pick a topic. Every course opens with a short welcome or a first lesson that sets up the story.</p></div>
      <div class="chips" role="group" aria-label="Filter by topic">${themes.map(([k, v]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${k === filter}">${esc(v)}</button>`).join('')}</div>
    </div>
    <div class="grid" id="grid"></div>
  </div></section>

  <section class="how" id="how-it-works"><div class="wrap">
    <div class="sechead"><div><h2>How the courses work</h2></div></div>
    <ul>
      <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><h3>Follow one person's story</h3><p>Most courses have a main character, like Nikhil, a new team lead in Pune, or Arjun, who earns well and is still broke by the 22nd. You learn by watching them work it out.</p></li>
      <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg></span><h3>Lessons of about three minutes</h3><p>Watch one lesson on a break, or a whole course in under an hour. Each lesson covers one idea.</p></li>
      <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span><h3>Set in Indian workplaces</h3><p>The offices, cities, salaries and situations are Indian, so the advice fits the work you actually do.</p></li>
    </ul>
  </div></section>

  <section id="people"><div class="wrap">
    <div class="sechead"><div><h2>Some of the people you'll follow</h2><p>Each story runs across a whole course, so you see the change happen.</p></div></div>
    <div class="people">${courses.filter(c => c.who).map(c => `<a class="person" href="#course-${c.slug}" style="--c:${c.color};--ci:${c.ink}"><span class="av" aria-hidden="true">${esc(c.who[0])}</span><b>${esc(c.who)}</b><span>${esc(c.whoLine)}</span><small>${esc(c.title)} →</small></a>`).join('')}</div>
  </div></section>

  <section class="about" id="about"><div class="wrap">
    <h2 style="font-size:clamp(28px,3.4vw,40px);font-weight:800">About Amey</h2>
    <div>
      <p>Amey Hegde is a corporate trainer based in Goa. Mentor Moments with Amey is his series of short animated courses for working professionals, free to watch on YouTube.</p>
      <p>The courses cover leading a team, emotional intelligence, communication, wellbeing and resilience, time and focus, working with AI, personal finance and, for engineers, the chip design flow.</p>
      <a class="btn ghost" href="https://ameyhegde.in" target="_blank" rel="noopener">Visit ameyhegde.in ${EXT}</a>
    </div>
  </div></section>`;
  drawGrid();
  app.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { filter = b.dataset.f; app.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b)); drawGrid(); }));
  if (anchor && document.getElementById(anchor)) requestAnimationFrame(() => document.getElementById(anchor).scrollIntoView());
  else window.scrollTo(0, 0);
}
function drawGrid() {
  const list = courses.filter(c => filter === 'all' || c.theme === filter);
  document.getElementById('grid').innerHTML = list.map(cardHTML).join('') || '<p class="empty">No courses in this topic yet.</p>';
}

function renderCourse(c) {
  stopPlayer();
  document.title = c.title + ' · Mentor Moments with Amey';
  let lang = 'en';
  const last = store.get();
  const resume = last && last.slug === c.slug ? last : null;
  if (resume && resume.lang === 'hi' && c.hindi) lang = 'hi';
  const eyebrow = c.label !== c.title ? c.label : THEME[c.theme];
  const others = courses.filter(o => o !== c).sort((a, b) => (b.theme === c.theme) - (a.theme === c.theme)).slice(0, 3);
  app.innerHTML = `
  <div class="chero" style="--c:${c.color};--ci:${c.ink}"><div class="wrap">
    <div>
      <a class="back" href="#courses">${ARROW_L}All courses</a>
      <div class="eyebrow">${esc(eyebrow)}</div>
      <h1>${esc(c.title)}</h1>
      <p class="sub">${esc(c.sub)}</p>
      <div class="facts">${facts(c).map(f => `<span>${esc(f)}</span>`).join('')}</div>
      <div class="cta">
        ${EMBED ? `<button class="btn primary" type="button" id="start">${PLAY.replace('#1F2A44', 'currentColor')}${resume ? 'Continue the course' : 'Start the course'}</button>`
                : `<a class="btn primary" href="${ytUrl(c, lang, 0)}" target="_blank" rel="noopener">${PLAY.replace('#1F2A44', 'currentColor')}Start the course</a>`}
        <a class="btn ghost" href="${c.playlist}" target="_blank" rel="noopener">Open on YouTube ${EXT}</a>
      </div>
    </div>
    <div class="bigcv" aria-hidden="true">${c.cover}</div>
  </div></div>

  <section class="watch" id="watch"><div class="wrap">
    <div class="stage">
      <div>
        <div class="player">${posterHTML(c, lang, resume ? resume.i : 0)}<div id="yt"></div></div>
        ${EMBED ? '' : '<p class="note">Videos open on YouTube in a new tab.</p>'}
      </div>
      <aside class="panel" id="panel"></aside>
    </div>
  </div></section>

  <section class="story"><div class="wrap">
    <h2 style="font-size:clamp(26px,3vw,34px);font-weight:800">About this course</h2>
    <div>${c.story.map(p => `<p>${esc(p)}</p>`).join('')}</div>
  </div></section>

  <section class="more"><div class="wrap">
    <div class="sechead"><div><h2>More courses</h2></div><a class="btn ghost" href="#courses">See all ${courses.length}</a></div>
    <div class="grid">${others.map(cardHTML).join('')}</div>
  </div></section>`;

  const panel = document.getElementById('panel');
  const drawPanel = () => {
    const list = lessonsOf(c, lang);
    if (!list) {
      panel.innerHTML = `<div class="ph"><h2>What's inside</h2></div>
        <dl class="inside">
          <div><dt>Lessons</dt><dd>${c.count}${c.soFar ? ' so far' : ''}</dd></div>
          <div><dt>Length</dt><dd>${c.minutes ? 'About ' + c.minutes + ' minutes' : 'About 3 minutes a lesson'}</dd></div>
          <div><dt>Format</dt><dd>Animated, story-led</dd></div>
          <div><dt>Language</dt><dd>English</dd></div>
          <div><dt>Price</dt><dd>Free</dd></div>
        </dl>
        <p>${EMBED ? 'Use the playlist button at the top right of the player to jump to any lesson.' : 'The full lesson list is in the playlist on YouTube.'}</p>`;
      return;
    }
    panel.innerHTML = `<div class="ph"><h2>Lessons</h2>${c.hindi ? `<div class="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-pressed="${lang === 'en'}">English</button><button type="button" data-l="hi" aria-pressed="${lang === 'hi'}" lang="hi">हिन्दी</button></div>` : `<span>${list.length} videos</span>`}</div>
      <ol class="lessons" ${lang === 'hi' ? 'lang="hi"' : ''}>${list.map((l, i) => `<li data-i="${i}">${EMBED
        ? `<button type="button"><span class="n">${label(l, i, list)}</span>${rowText(l)}</button>`
        : `<a href="${ytUrl(c, lang, i)}" target="_blank" rel="noopener"><span class="n">${label(l, i, list)}</span>${rowText(l)}</a>`}</li>`).join('')}</ol>`;
    panel.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.l; drawPanel(); resetPoster(); }));
    if (EMBED) panel.querySelectorAll('.lessons li').forEach(li => li.addEventListener('click', () => playIndex(c, lang, +li.dataset.i)));
    else panel.querySelectorAll('.lessons a').forEach((a, i) => a.addEventListener('click', () => store.set({ slug: c.slug, i, lang })));
    if (resume && resume.lang === lang) markActive(resume.i);
  };
  const resetPoster = () => { if (player) return; const p = app.querySelector('.player'); p.querySelector('.poster').outerHTML = posterHTML(c, lang, 0); wirePoster(); };
  const wirePoster = () => {
    const p = app.querySelector('.poster');
    if (EMBED) p.addEventListener('click', () => playIndex(c, lang, +p.dataset.i));
    else p.addEventListener('click', () => store.set({ slug: c.slug, i: +p.dataset.i, lang }));
  };
  drawPanel(); wirePoster();
  const st = document.getElementById('start');
  if (st) st.addEventListener('click', () => { document.getElementById('watch').scrollIntoView(); playIndex(c, lang, resume && resume.lang === lang ? resume.i : 0); });
  window.scrollTo(0, 0);
}
function posterHTML(c, lang, i) {
  const list = lessonsOf(c, lang); const it = list && list[i];
  const cap = it ? `<small>${it && /^welcome$/i.test(it.t) ? 'Start here' : 'Lesson ' + label(it, i, list)}</small>${esc(it.t)}` : `<small>${c.count} lessons</small>Play the whole course`;
  const art = c.cover.replace('<svg ', '<svg class="art" ');
  return EMBED ? `<button class="poster" type="button" data-i="${i}" aria-label="Play ${esc(it ? it.t : c.title)}">${art}<span class="pl">${PLAY}</span><span class="cap">${cap}</span></button>`
               : `<a class="poster" href="${ytUrl(c, lang, i)}" data-i="${i}" target="_blank" rel="noopener" aria-label="Watch ${esc(it ? it.t : c.title)} on YouTube">${art}<span class="pl">${PLAY}</span><span class="cap">${cap}<br><small style="margin:6px 0 0;text-transform:none;letter-spacing:0">Opens on YouTube</small></span></a>`;
}
function markActive(i) { app.querySelectorAll('.lessons li').forEach(li => li.classList.toggle('on', +li.dataset.i === i)); }

// ---------- YouTube player (hosted copy only)
let player = null, ytReady = false, pending = null;
if (EMBED) {
  window.onYouTubeIframeAPIReady = () => { ytReady = true; if (pending) { const p = pending; pending = null; startPlayer(...p); } };
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.async = true; document.head.appendChild(s);
}
function playIndex(c, lang, i) {
  markActive(i); store.set({ slug: c.slug, i, lang });
  if (!ytReady) { pending = [c, lang, i]; return; }
  startPlayer(c, lang, i);
}
function startPlayer(c, lang, i) {
  const list = lessonsOf(c, lang);
  const ids = list && list.every(l => l.id) ? list.map(l => l.id) : null;
  const load = p => ids ? p.loadPlaylist(ids, i) : p.loadPlaylist({ list: c.list, listType: 'playlist', index: i });
  if (player && player.key === c.slug + lang) { load(player); return; }
  stopPlayer();
  const poster = app.querySelector('.poster'); if (poster) poster.hidden = true;
  document.getElementById('yt').innerHTML = '<div id="ytp"></div>';
  player = new YT.Player('ytp', {
    host: 'https://www.youtube-nocookie.com', width: '100%', height: '100%',
    playerVars: { rel: 0, playsinline: 1, modestbranding: 1, origin: location.origin },
    events: {
      onReady: e => load(e.target),
      onStateChange: e => { if (e.data === 1) { const k = e.target.getPlaylistIndex(); if (k >= 0) { markActive(k); store.set({ slug: c.slug, i: k, lang }); } } }
    }
  });
  player.key = c.slug + lang;
}
function stopPlayer() { if (player) { try { player.destroy(); } catch (e) {} player = null; } }

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('course-') && BY[h.slice(7)]) renderCourse(BY[h.slice(7)]);
  else renderHome(h);
}
window.addEventListener('hashchange', route);
route();
</script>

</body>
</html>
