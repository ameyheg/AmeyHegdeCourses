<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Mentor Moments with Amey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Free animated courses on YouTube by Corporate Trainer Amey Hegde: leading a team, wellbeing, communication, productivity, AI, money and chip design. About three minutes a lesson.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: a navy "situation finder" opens the page (a real work situation, the lesson that answers it, and search across every lesson),
   then the nine courses as tiles in their own colours; a course page is a theatre in the course colour, player and lesson list side by side. */
:root {
  --paper: #F1F2F6; --surface: #FFFFFF; --sunk: #E7E9F0; --ink: #151C33; --mute: #586079; --line: #DADEE8;
  --navy: #151C33; --navy-2: #1D2645; --on-navy: #FFF7EC; --navy-mute: #AAB2CC; --navy-line: rgba(255,247,236,.14);
  --saffron: #F4A024; --saffron-ink: #9A5600; --ok: #17945A; --on-ok: #FFFFFF; --field: #FFFFFF; --field-line: transparent;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Mukta", "Segoe UI", system-ui, sans-serif;
  --max: 1240px; --ease: cubic-bezier(.2, .8, .2, 1);
  --lift: 0 1px 2px rgba(21,28,51,.06), 0 18px 40px -18px rgba(21,28,51,.28);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0B1020; --surface: #141B30; --sunk: #1B233B; --ink: #EEF0F7; --mute: #9CA4BE; --line: #262F4A;
  --navy: #10172C; --navy-2: #18213D; --navy-line: rgba(255,247,236,.11);
  --saffron-ink: #FFC266; --ok: #33C27F; --on-ok: #0B1020; --field: #222C4E; --field-line: rgba(255,247,236,.2);
  --lift: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -18px rgba(0,0,0,.7); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0B1020; --surface: #141B30; --sunk: #1B233B; --ink: #EEF0F7; --mute: #9CA4BE; --line: #262F4A;
  --navy: #10172C; --navy-2: #18213D; --navy-line: rgba(255,247,236,.11);
  --saffron-ink: #FFC266; --ok: #33C27F; --on-ok: #0B1020; --field: #222C4E; --field-line: rgba(255,247,236,.2);
  --lift: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -18px rgba(0,0,0,.7); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 84px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--navy); }
a { color: inherit; }
img, svg { max-width: 100%; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: var(--max); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 760px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 3px; border-radius: 8px; }
kbd { font: 600 12px/1 var(--display); padding: 5px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--mute); background: var(--paper); }

/* ---------- art motion: still until something asks it to move */
.mv { transform-box: view-box; animation-play-state: paused; }
.tile:hover .mv, .tile:focus-visible .mv, .lc[data-pos="0"] .mv, .poster:hover .mv, .poster:focus-visible .mv, .cc:hover .mv, .live .mv { animation-play-state: running; }
.mv-spin { animation: mvSpin 22s linear infinite; }
.mv-spin-fast { animation: mvSpin 6s linear infinite; }
.mv-spin-slow { animation: mvSpin 72s linear infinite; }
.mv-hop { animation: mvHop .9s ease-in-out infinite alternate; }
.mv-bob { animation: mvBob 2.2s ease-in-out infinite alternate; }
.mv-bob2 { animation: mvBob 2.2s ease-in-out -1.1s infinite alternate; }
.mv-dash { animation: mvDash 2.4s linear infinite; }
.mv-glow { animation: mvGlow 1.6s ease-in-out infinite alternate; }
.mv-pulse { animation: mvPulse 2s ease-out infinite; }
.mv-blink { animation: mvBlink 1.4s ease-in-out infinite; }
.mv-dot { animation: mvDot 1.1s ease-in-out infinite; }
.mv-rise { animation: mvRise 1.6s ease-in-out infinite alternate; }
@keyframes mvSpin { to { transform: rotate(1turn); } }
@keyframes mvHop { to { transform: translateY(-9px); } }
@keyframes mvBob { to { transform: translateY(-6px); } }
@keyframes mvDash { to { stroke-dashoffset: -44; } }
@keyframes mvGlow { to { opacity: .5; } }
@keyframes mvPulse { from { transform: scale(.85); opacity: .5; } to { transform: scale(1.9); opacity: 0; } }
@keyframes mvBlink { 50% { opacity: .2; } }
@keyframes mvDot { 50% { transform: translateY(-6px); } }
@keyframes mvRise { to { transform: translateY(-7px); } }

/* ---------- header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--navy); color: var(--on-navy); border-bottom: 1px solid var(--navy-line); }
.top .wrap { display: flex; align-items: center; gap: 18px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; min-width: 0; }
.mark { width: 38px; height: 38px; border-radius: 11px; background: var(--saffron); display: grid; place-items: center; flex: none; }
.mark svg { width: 16px; height: 16px; margin-left: 2px; }
.brand b { display: block; font: 700 18px/1.05 var(--display); letter-spacing: -.02em; }
.brand small { display: block; font: 500 13px/1.2 var(--body); color: var(--navy-mute); }
.top nav { display: flex; gap: 4px; }
.top nav a { font: 500 15px/1 var(--display); text-decoration: none; color: var(--navy-mute); padding: 10px 12px; border-radius: 10px; }
.top nav a:hover { color: var(--on-navy); background: rgba(255,247,236,.07); }
.sbtn { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 8px 0 13px; min-width: 230px; border-radius: 12px; border: 1px solid var(--navy-line); background: rgba(255,247,236,.06); color: var(--navy-mute); cursor: pointer; font: 500 15px/1 var(--body); }
.sbtn:hover { color: var(--on-navy); border-color: rgba(255,247,236,.3); }
.sbtn svg { width: 18px; height: 18px; flex: none; }
.sbtn span { margin-right: auto; }
.sbtn kbd { background: transparent; border-color: var(--navy-line); color: var(--navy-mute); }
.site { font: 600 14px/1 var(--display); text-decoration: none; padding: 12px 14px; border-radius: 12px; white-space: nowrap; box-shadow: inset 0 0 0 1px var(--navy-line); }
.site:hover { box-shadow: inset 0 0 0 1px rgba(255,247,236,.35); }
@media (max-width: 1060px) { .top nav { display: none; } }
@media (max-width: 700px) { .field kbd { display: none; } .sbtn { min-width: 0; width: 42px; padding: 0; justify-content: center; } .sbtn span, .sbtn kbd { display: none; } }
@media (max-width: 440px) { .site { display: none; } .brand small { display: none; } }

/* ---------- hero: situation finder */
.hero { position: relative; z-index: 5; background: var(--navy); color: var(--on-navy); overflow-x: clip; }
.hero-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.glow { position: absolute; width: 720px; height: 720px; right: -160px; top: -260px; border-radius: 50%; background-color: var(--glow, #F4A024); opacity: .28; filter: blur(110px); transition: background-color 1.4s ease; }
.glow.b { width: 520px; height: 520px; left: -220px; right: auto; top: auto; bottom: -320px; background-color: #3D5BD9; opacity: .22; }
.hero-bg::after { content: ""; position: absolute; inset: 0; opacity: .07; background-image: radial-gradient(rgba(255,247,236,.9) 1px, transparent 1.2px); background-size: 22px 22px; mask-image: linear-gradient(180deg, #000, transparent 85%); }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); grid-template-areas: "copy stack" "find stack" "more stack"; column-gap: clamp(32px, 6vw, 88px); align-items: start; padding-block: clamp(44px, 6vw, 84px) clamp(52px, 6vw, 92px); }
.h-copy { grid-area: copy; }
.h-find { grid-area: find; }
.h-more { grid-area: more; }
.h-stack { grid-area: stack; align-self: center; }
.sit { font: 800 clamp(40px, 5.4vw, 74px)/1.0 var(--display); letter-spacing: -.035em; min-height: 3.05em; display: flex; flex-direction: column; justify-content: flex-end; }
.rot { display: block; }
.rot .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
.rot .w > span { display: inline-block; animation: wIn .7s var(--ease) both; animation-delay: calc(var(--k) * 40ms); }
.rot.out .w > span { animation: wOut .32s ease-in both; animation-delay: calc(var(--k) * 18ms); }
@keyframes wIn { from { transform: translateY(105%); } }
@keyframes wOut { to { transform: translateY(-105%); } }
.answer { margin-top: 18px; font: 600 clamp(20px, 2.1vw, 26px)/1.3 var(--display); letter-spacing: -.01em; color: var(--saffron); }
.h-find { position: relative; margin-top: 30px; max-width: 620px; }
.field { display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 12px 0 18px; border-radius: 18px; background: var(--field); color: var(--ink); box-shadow: inset 0 0 0 1px var(--field-line), 0 24px 60px -20px rgba(0,0,0,.6); transition: box-shadow .2s ease; }
.field:focus-within { box-shadow: 0 0 0 3px var(--saffron), 0 24px 60px -20px rgba(0,0,0,.6); }
.field > svg { width: 22px; height: 22px; flex: none; color: var(--mute); }
.field input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--ink); font: 500 18px/1 var(--body); }
.field input::placeholder { color: var(--mute); opacity: 1; }
.field input::-webkit-search-cancel-button { display: none; }
.clear { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--sunk); color: var(--mute); cursor: pointer; display: grid; place-items: center; flex: none; }
.clear svg { width: 16px; height: 16px; }
.try { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; color: var(--navy-mute); font-size: 15px; }
.try button { font: 500 14px/1 var(--display); color: var(--on-navy); background: rgba(255,247,236,.07); border: 1px solid var(--navy-line); border-radius: 999px; padding: 9px 13px; cursor: pointer; }
.try button:hover { background: rgba(255,247,236,.14); }
.lede { margin-top: 28px; max-width: 36em; color: var(--navy-mute); font-size: 17px; line-height: 1.6; }
.lede b { color: var(--on-navy); font-weight: 600; }

/* results list, used under the hero field and in the search dialog */
.pop { position: absolute; left: 0; right: 0; top: calc(100% + 10px); z-index: 30; background: var(--surface); color: var(--ink); border-radius: 18px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.55), 0 0 0 1px var(--line); max-height: min(470px, 62vh); overflow-y: auto; padding: 8px; overscroll-behavior: contain; }
.res-h { font: 600 13px/1.3 var(--display); color: var(--mute); padding: 10px 12px 6px; }
.hit { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 12px; text-decoration: none; color: inherit; }
.hit:hover, .hit.act { background: var(--sunk); }
.hit .sw svg { width: 14px; height: 14px; margin-left: 2px; }
.hit .sw { width: 42px; height: 42px; border-radius: 12px; background: var(--c); color: var(--ci); display: grid; place-items: center; font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; }
.hit b { display: block; font: 600 16px/1.3 var(--display); letter-spacing: -.005em; }
.hit small { display: block; margin-top: 2px; color: var(--mute); font-size: 14px; line-height: 1.35; }
.hit .d { font: 500 13px/1 var(--display); color: var(--mute); font-variant-numeric: tabular-nums; }
.hit mark { background: color-mix(in srgb, var(--saffron) 38%, transparent); color: inherit; border-radius: 4px; padding: 0 2px; }
.hit[lang="hi"] b { font-family: var(--body); font-size: 17px; }
.none { padding: 18px 14px; color: var(--mute); }
.none b { color: var(--ink); }

/* lesson card stack */
.stack { position: relative; width: min(100%, 470px); margin: 26px 0 0 auto; aspect-ratio: 10 / 10.6; }
.lc { position: absolute; left: 0; bottom: 0; width: 84%; display: block; border-radius: 24px; overflow: hidden; background: var(--c); color: var(--ci); text-decoration: none; box-shadow: 0 40px 80px -30px rgba(0,0,0,.75); transform-origin: 50% 100%; transition: transform .8s var(--ease), opacity .6s ease, filter .6s ease; will-change: transform; }
.lc[data-pos="0"] { z-index: 3; }
.lc[data-pos="1"] { z-index: 2; transform: translate(9%, -9%) rotate(5deg) scale(.95); filter: brightness(.82); pointer-events: none; }
.lc[data-pos="2"] { z-index: 1; transform: translate(16%, -18%) rotate(10deg) scale(.9); filter: brightness(.66); pointer-events: none; }
.lc[data-pos="in"] { z-index: 0; transform: translate(22%, -26%) rotate(14deg) scale(.86); opacity: 0; pointer-events: none; }
.lc[data-pos="out"] { z-index: 4; transform: translate(-42%, 8%) rotate(-14deg); opacity: 0; pointer-events: none; }
.lc-art { position: relative; aspect-ratio: 16 / 9; overflow: hidden; }
.lc-art > svg, .lc-art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.lc-play { position: absolute; left: 18px; bottom: 16px; width: 54px; height: 54px; border-radius: 50%; background: #FFF7EC; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(0,0,0,.35); transition: transform .25s var(--ease); }
.lc-play svg { width: 20px; height: 20px; margin-left: 3px; }
.lc:hover .lc-play { transform: scale(1.08); }
.lc-dur { position: absolute; right: 14px; bottom: 16px; font: 600 13px/1 var(--display); color: #fff; background: rgba(8,12,24,.72); padding: 6px 9px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.lc-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 6px; }
.lc-course { font: 500 14px/1.3 var(--display); opacity: .8; }
.lc-title { font: 700 clamp(19px, 1.8vw, 23px)/1.18 var(--display); letter-spacing: -.015em; }
.lc-meta { font-size: 15px; opacity: .78; }
.stack-ctl { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 18px; color: var(--navy-mute); font: 500 14px/1 var(--display); font-variant-numeric: tabular-nums; }
.stack-ctl button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--navy-line); background: rgba(255,247,236,.05); color: var(--on-navy); cursor: pointer; display: grid; place-items: center; }
.stack-ctl button:hover { background: rgba(255,247,236,.12); }
.stack-ctl svg { width: 18px; height: 18px; }
.stack-ctl span { min-width: 64px; text-align: center; }
@media (max-width: 980px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); grid-template-areas: "copy" "find" "stack" "more"; }
  .stack { margin: 34px auto 0; width: min(100%, 440px); }
  .stack-ctl { justify-content: center; }
}

/* ---------- sections */
.sec { padding-block: clamp(56px, 7vw, 96px); }
.sechead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 18px 32px; margin-bottom: 30px; }
.big { font: 800 clamp(30px, 3.6vw, 46px)/1.04 var(--display); letter-spacing: -.035em; }
.sechead p { margin-top: 10px; color: var(--mute); max-width: 36em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { display: inline-flex; align-items: center; gap: 8px; font: 500 15px/1 var(--display); padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chips button span { color: var(--mute); font-variant-numeric: tabular-nums; }
.chips button:hover { border-color: var(--mute); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chips button[aria-pressed="true"] span { color: inherit; opacity: .7; }

/* continue watching */
.cont { padding-block: 40px 0; }
.cont h2 { font: 700 22px/1.2 var(--display); letter-spacing: -.02em; margin-bottom: 16px; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 380px); gap: 14px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
.cc { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: inherit; scroll-snap-align: start; transition: border-color .2s ease; }
.cc:hover { border-color: var(--mute); }
.cc .ca { aspect-ratio: 1; border-radius: 12px; overflow: hidden; }
.cc .ca svg { display: block; width: 100%; height: 100%; }
.cc small { display: block; color: var(--mute); font-size: 14px; line-height: 1.3; }
.cc b { display: block; font: 600 16px/1.25 var(--display); margin: 3px 0 9px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bar { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; width: var(--p); background: var(--ok); border-radius: inherit; }

/* course tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.tile { position: relative; display: flex; flex-direction: column; border-radius: 26px; overflow: hidden; background: var(--c); color: var(--ci); text-decoration: none; transition: transform .4s var(--ease), box-shadow .4s var(--ease); }
.tile:hover { transform: translateY(-6px); box-shadow: 0 28px 50px -24px color-mix(in srgb, var(--c) 80%, #000); }
.tile-art { aspect-ratio: 16 / 10; overflow: hidden; }
.tile-art svg { display: block; width: 100%; height: 100%; transition: transform .8s var(--ease); }
.tile:hover .tile-art svg { transform: scale(1.04); }
.tile-body { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 18px 22px 24px; }
.tile-topic { font: 500 14px/1.2 var(--display); opacity: .72; }
.tile h3 { font: 700 25px/1.08 var(--display); letter-spacing: -.025em; }
.tile p { font-size: 16px; line-height: 1.4; opacity: .82; }
.tile-meta { margin-top: auto; padding-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; font: 500 14px/1 var(--display); font-variant-numeric: tabular-nums; }
.tile-meta span { padding: 7px 10px; border-radius: 999px; background: color-mix(in srgb, var(--ci) 13%, transparent); }
.tile-meta .who { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; }
.tile-meta .who i { width: 22px; height: 22px; border-radius: 50%; background: var(--ci); color: var(--c); display: grid; place-items: center; font: 800 12px/1 var(--display); font-style: normal; }
.tile-prog { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: color-mix(in srgb, var(--ci) 20%, transparent); }
.tile-prog i { display: block; height: 100%; width: var(--p); background: var(--ci); }
.empty { color: var(--mute); }
@media (max-width: 1040px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) {
  .tiles { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .tile { flex-direction: row; border-radius: 20px; min-height: 132px; }
  .tile:hover { transform: none; }
  .tile-art { width: 36%; flex: none; aspect-ratio: auto; }
  .tile-body { padding: 14px 14px 16px; gap: 4px; min-width: 0; }
  .tile h3 { font-size: 19px; }
  .tile p { font-size: 15px; }
  .tile-topic { font-size: 13px; }
  .tile-meta { padding-top: 10px; font-size: 13px; }
  .tile-meta span { padding: 6px 8px; }
  .tile-meta .who { display: none; }
}

/* how it works */
.how { background: var(--surface); border-block: 1px solid var(--line); }
.how ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
.how li { display: flex; flex-direction: column; gap: 10px; }
.how .ic { width: 52px; height: 52px; border-radius: 16px; background: color-mix(in srgb, var(--saffron) 18%, transparent); color: var(--saffron-ink); display: grid; place-items: center; }
.how .ic svg { width: 26px; height: 26px; }
.how h3 { font: 700 21px/1.2 var(--display); letter-spacing: -.015em; margin-top: 6px; }
.how p { color: var(--mute); max-width: 30em; }
@media (max-width: 760px) { .how ul { grid-template-columns: minmax(0, 1fr); gap: 26px; } }

/* the people in the stories */
.cast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.person { display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: inherit; transition: border-color .2s ease, transform .3s var(--ease); scroll-snap-align: start; }
.person:hover { border-color: var(--c); transform: translateY(-3px); }

      <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg></span><h3>About three minutes a lesson</h3><p>Watch one lesson over a cup of chai, or a whole course in under an hour. Each lesson covers one idea you can use the same day.</p></li>
      <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span><h3>Set in Indian workplaces</h3><p>The offices, cities, salaries and situations are Indian, so the advice fits the work you actually do.</p></li>
    </ul>
  </div></section>

  <section class="sec" id="stories"><div class="wrap">
    <div class="sechead"><div><h2 class="big">The people you'll follow</h2><p>Each story runs across a whole course, so you see the change happen.</p></div></div>
    <div class="cast">${courses.filter(c => c.who).map(c => `<a class="person" href="#course-${c.slug}" style="--c:${c.color};--ci:${c.ink}"><span class="av" aria-hidden="true">${esc(c.who[0])}</span><b>${esc(c.who)}</b><span>${esc(c.whoLine)}</span><small>${esc(c.title)}</small></a>`).join('')}</div>
  </div></section>

  <section class="sec about" id="about"><div class="wrap">
    <h2 class="big">About Amey</h2>
    <div>
      <p>Amey Hegde is a corporate trainer based in Goa. Mentor Moments with Amey is his series of short animated courses for working professionals, free to watch on YouTube.</p>
      <p>The courses cover leading a team, emotional intelligence, communication, wellbeing and resilience, time and focus, working with AI, personal finance and, for engineers, the chip design flow.</p>
      <a class="btn line" href="https://ameyhegde.in" target="_blank" rel="noopener">Visit ameyhegde.in ${I.ext}</a>
    </div>
  </div></section>`;

  drawGrid();
  $$('.chips button').forEach(b => b.addEventListener('click', () => { filter = b.dataset.f; $$('.chips button').forEach(x => x.setAttribute('aria-pressed', x === b)); drawGrid(); }));
  // hero search
  const q = $('#q'), pop = $('#qres'), clr = $('#qclear'), kb = $('#qkbd');
  if (window.innerWidth < 560) q.placeholder = 'Search ' + DATA.total + ' lessons';
  const show = v => { pop.hidden = !v; q.setAttribute('aria-expanded', v); };
  const hf = finder(q, pop, 'q', { onPick: () => show(false), onEsc: () => { if (q.value) { q.value = ''; hf.draw(); sync(); } else { show(false); q.blur(); } } });
  const sync = () => { clr.hidden = !q.value; kb.hidden = !!q.value || document.activeElement === q; };
  q.addEventListener('focus', () => { hf.draw(); show(true); sync(); });
  q.addEventListener('input', () => { show(true); sync(); });
  q.addEventListener('blur', () => setTimeout(() => { if (!$('.h-find') || !$('.h-find').contains(document.activeElement)) { show(false); sync(); } }, 150));
  clr.addEventListener('click', () => { q.value = ''; hf.draw(); q.focus(); sync(); });
  $$('.try button').forEach(b => b.addEventListener('click', () => { q.value = b.dataset.q; q.focus(); hf.draw(); show(true); sync(); }));
  startHero();
  if (anchor && document.getElementById(anchor)) requestAnimationFrame(() => document.getElementById(anchor).scrollIntoView());
  else window.scrollTo(0, 0);
}
function drawGrid() {
  const list = courses.filter(c => filter === 'all' || c.theme === filter);
  $('#grid').innerHTML = list.map(tileHTML).join('') || '<p class="empty">No courses in this topic yet.</p>';
}

// ---------- course page
let cur = null;
function renderCourse(c, r) {
  leaveCourse(); stopHero();
  document.title = c.title + ' · Mentor Moments with Amey';
  let lang = r.lang || nextFor(c).lang; if (lang === 'hi' && !c.hindi) lang = 'en';
  let list = lessonsOf(c, lang);
  let sel = r.i != null && r.i < list.length ? r.i : nextFor(c, lang).i;
  const topic = c.label !== c.title ? c.label : THEME[c.theme];
  const others = courses.filter(o => o !== c).sort((a, b) => (b.theme === c.theme) - (a.theme === c.theme)).slice(0, 3);
  const facts = [c.count + ' lessons', c.minutes ? 'About ' + c.minutes + ' min' : null, c.hindi ? 'English and Hindi' : 'English', 'Free on YouTube'].filter(Boolean);
  app.innerHTML = `
  <section class="theatre" style="--c:${c.color};--ci:${c.ink}"><div class="wrap">
    <a class="back" href="#courses">${I.back}All courses</a>
    <div class="th-head">
      <div><div class="th-topic">${esc(topic)}</div><h1>${esc(c.title)}</h1><p class="sub">${esc(c.sub)}</p></div>
      <div class="th-side">
        <div class="facts">${facts.map(f => `<span>${esc(f)}</span>`).join('')}</div>
        <div class="meter" aria-hidden="true"><i id="meter"></i></div>
        <div class="meter-l" id="meterL"></div>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="stage-main">
        <div class="player" id="player" style="--plc:${c.color.toUpperCase() === '#F4A024' ? '#FFF7EC' : '#F4A024'}"><div id="yt"></div></div>
        <div class="nowbar">
          <div class="now" id="now" aria-live="polite"></div>
          <div class="nb">
            <button class="nbtn" type="button" id="bPrev">${I.prev}Previous</button>
            <button class="nbtn" type="button" id="bNext">Next${I.next}</button>
            <button class="nbtn" type="button" id="bDone" aria-pressed="false">${I.check}<span>Watched</span></button>
            ${EMBED ? `<button class="nbtn" type="button" id="bLink">${I.link}Copy link</button>` : ''}
          </div>
        </div>
      </div>
      <aside class="panel" aria-label="Lessons"><div class="panel-in" id="panel"></div></aside>
    </div>
  </div></section>

  <section class="sec cabout"><div class="wrap">
    <div class="story"><h2 class="big">About this course</h2>${c.story.map(p => `<p>${esc(p)}</p>`).join('')}</div>
    <div class="follow" style="--c:${c.color};--ci:${c.ink}">
      ${c.who ? `<span class="av" aria-hidden="true">${esc(c.who[0])}</span><small>You'll follow</small><b>${esc(c.who)}</b><span>${esc(c.whoLine)}</span>`
              : `<small>On YouTube</small><b>${esc(c.title)}</b><span>${c.count} lessons in one playlist${c.minutes ? ', about ' + c.minutes + ' minutes in all' : ''}.</span>`}
      <a class="btn line" href="${c.playlist}" target="_blank" rel="noopener">Open the playlist ${I.ext}</a>
    </div>
  </div></section>

  <section class="sec more"><div class="wrap">
    <div class="sechead"><h2 class="big">More courses</h2><a class="btn line" href="#courses">See all ${courses.length}</a></div>
    <div class="tiles">${others.map(tileHTML).join('')}</div>
  </div></section>`;

  const panel = $('#panel'), now = $('#now'), bDone = $('#bDone');
  const drawPanel = () => {
    const thumbs = EMBED && list.every(l => l.id);
    panel.innerHTML = `<div class="ph"><h2>Lessons<span id="phc"></span></h2>${c.hindi ? `<div class="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-pressed="${lang === 'en'}">English</button><button type="button" data-l="hi" lang="hi" aria-pressed="${lang === 'hi'}">हिन्दी</button></div>` : ''}</div>
      <ol class="lessons${thumbs ? ' thumbs' : ''}" ${lang === 'hi' ? 'lang="hi"' : ''}>${list.map((l, i) => {
        const inner = thumbs
          ? `<span class="th"><img src="${thumb(l.id)}" alt="" loading="lazy" onerror="this.remove()">${l.d ? `<span class="d">${esc(l.d)}</span>` : ''}<span class="ck" hidden>${I.check}</span></span><span class="t"><small>${esc(lessonName(list, i))}</small>${esc(l.t)}</span>`
          : `<span class="n">${esc(badge(list, i))}</span><span class="t">${esc(l.t)}</span><span class="d">${esc(l.d || '')}</span>`;
        return `<li data-i="${i}">${EMBED ? `<button class="row" type="button">${inner}</button>` : `<a class="row" href="${ytUrl(c, lang, i)}" target="_blank" rel="noopener">${inner}</a>`}</li>`;
      }).join('')}</ol>`;
    $$('.lang button', panel).forEach(b => b.addEventListener('click', () => { if (b.dataset.l !== lang) select(b.dataset.l, 0); }));
    $$('.lessons li', panel).forEach(li => li.firstElementChild.addEventListener('click', () => {
      const i = +li.dataset.i;
      if (EMBED) select(lang, i, { play: true });
      else { store.setDone(c.slug, lang, i, true); select(lang, i); }
    }));
  };
  const refresh = () => {
    const p = progress(c, lang);
    $('#meter').style.setProperty('--p', (100 * p.done / p.total) + '%');
    $('#meterL').textContent = p.done ? (p.done === p.total ? 'You have watched every lesson' : p.done + ' of ' + p.total + ' lessons watched') : 'Your progress is saved in this browser';
    $('#phc').textContent = p.done + ' of ' + p.total + ' watched';
    $$('.lessons li', panel).forEach(li => {
      const i = +li.dataset.i, d = store.done(c.slug, lang, i);
      li.classList.toggle('on', i === sel); li.classList.toggle('done', d);
      const n = $('.n', li); if (n) n.innerHTML = d ? I.check : esc(badge(list, i));
      const ck = $('.ck', li); if (ck) ck.hidden = !d;
      li.firstElementChild.setAttribute('aria-current', i === sel ? 'true' : 'false');
    });
    const d = store.done(c.slug, lang, sel);
    bDone.setAttribute('aria-pressed', d); $('span', bDone).textContent = d ? 'Watched' : 'Mark as watched';
    $('#bPrev').disabled = sel === 0; $('#bNext').disabled = sel === list.length - 1;
  };
  const drawNow = () => {
    const l = list[sel];
    now.setAttribute('lang', lang === 'hi' ? 'hi' : 'en');
    const nx = list[sel + 1];
    now.innerHTML = nx ? `<small>Next up, ${esc(lessonName(list, sel + 1).replace(/ of \d+$/, '').toLowerCase())}${nx.d ? ', ' + esc(nx.d) : ''}</small><b>${esc(nx.t)}</b>`
                       : `<small>${esc(lessonName(list, sel))}</small><b>${lang === 'hi' ? 'This is the last lesson in Hindi' : 'This is the last lesson of the course'}</b>`;
  };
  const drawPoster = () => {
    if (player) return;
    const l = list[sel]; const old = $('.poster', $('#player')); if (old) old.remove();
    const img = EMBED && l.id ? `<img src="${thumb(l.id, 'maxresdefault')}" alt="" data-slug="${c.slug}" data-alt="${thumb(l.id, 'hqdefault')}" onerror="imgFail(this)">` : c.cover;
    const cap = `<span class="cap"><small>${esc(lessonName(list, sel))}${l.d ? ', ' + esc(l.d) : ''}</small><b ${lang === 'hi' ? 'lang="hi"' : ''}>${esc(l.t)}</b>${EMBED ? '' : `<em>${I.ext}Opens on YouTube</em>`}</span>`;
    const html = EMBED ? `<button class="poster" type="button" aria-label="Play ${esc(l.t)}">${img}<span class="pl">${I.play()}</span>${cap}</button>`
                       : `<a class="poster" href="${ytUrl(c, lang, sel)}" target="_blank" rel="noopener" aria-label="Watch ${esc(l.t)} on YouTube">${img}<span class="pl">${I.play()}</span>${cap}</a>`;
    $('#player').insertAdjacentHTML('afterbegin', html);
    $('.poster').addEventListener('click', () => { if (EMBED) select(lang, sel, { play: true }); else { store.setDone(c.slug, lang, sel, true); store.visit(c.slug, lang, sel); refresh(); } });
  };
  function select(l2, i, o) {
    o = o || {};
    if (l2 !== lang) { if (player) stopPlayer(); lang = l2; list = lessonsOf(c, lang); drawPanel(); }
    sel = Math.max(0, Math.min(i, list.length - 1));
    store.visit(c.slug, lang, sel);
    drawNow(); drawPoster(); refresh();
    if (EMBED) { try { history.replaceState(null, '', lessonHash(c, lang, sel)); } catch (e) {} }
    if (o.play && EMBED) playIndex(c, lang, sel);
    if (o.reveal) { const li = $(`.lessons li[data-i="${sel}"]`, panel); if (li && panel.offsetParent) li.scrollIntoView({ block: 'nearest' }); }
  }
  $('#bPrev').addEventListener('click', () => select(lang, sel - 1, { play: EMBED && !!player, reveal: true }));
  $('#bNext').addEventListener('click', () => select(lang, sel + 1, { play: EMBED && !!player, reveal: true }));
  bDone.addEventListener('click', () => { store.setDone(c.slug, lang, sel, !store.done(c.slug, lang, sel)); refresh(); });
  const bLink = $('#bLink');
  if (bLink) bLink.addEventListener('click', () => {
    const url = location.href.split('#')[0] + lessonHash(c, lang, sel);
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link to this lesson copied'), () => toast('Copy the link from the address bar'));
    else toast('Copy the link from the address bar');
  });
  cur = { c, select, refresh, get lang() { return lang; }, get sel() { return sel; } };
  drawPanel(); drawNow(); drawPoster(); refresh();
  const li = $(`.lessons li[data-i="${sel}"]`, panel);
  if (li && window.innerWidth > 1000) $('.lessons', panel).scrollTop = Math.max(0, li.offsetTop - 80);
  window.scrollTo(0, 0);
  if (r.i != null && window.innerWidth <= 1000) requestAnimationFrame(() => $('#player').scrollIntoView({ block: 'start' }));
  if (r.i != null && EMBED && Date.now() - lastNav < 1500) playIndex(c, lang, sel);
}
function leaveCourse() { stopPlayer(); cur = null; }

// ---------- YouTube player (hosted copy only)
let player = null, ytReady = false, pending = null, poll = null;
if (EMBED) {
  window.onYouTubeIframeAPIReady = () => { ytReady = true; if (pending) { const p = pending; pending = null; startPlayer(...p); } };
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.async = true; document.head.appendChild(s);
}
function playIndex(c, lang, i) {
  if (!ytReady) { pending = [c, lang, i]; return; }
  startPlayer(c, lang, i);
}
function startPlayer(c, lang, i) {
  const list = lessonsOf(c, lang);
  const ids = list.every(l => l.id) ? list.map(l => l.id) : null;
  const load = p => ids ? p.loadPlaylist(ids, i) : p.loadPlaylist({ list: c.list, listType: 'playlist', index: i });
  if (player && player.key === c.slug + lang) { try { player.playVideoAt(i); } catch (e) { load(player); } return; }
  stopPlayer();
  const poster = $('.poster'); if (poster) poster.remove();
  $('#yt').innerHTML = '<div id="ytp"></div>';
  const markIdx = k => { if (k >= 0) { store.setDone(c.slug, lang, k, true); if (cur && cur.c === c) cur.refresh(); } };
  player = new YT.Player('ytp', {
    host: 'https://www.youtube-nocookie.com', width: '100%', height: '100%',
    playerVars: { rel: 0, playsinline: 1, modestbranding: 1, origin: location.origin },
    events: {
      onReady: e => load(e.target),
      onStateChange: e => {
        const k = e.target.getPlaylistIndex ? e.target.getPlaylistIndex() : -1;
        if (e.data === 1 && k >= 0 && cur && cur.c === c && (k !== cur.sel || cur.lang !== lang)) cur.select(lang, k, { reveal: true });
        if (e.data === 0) markIdx(k);
      }
    }
  });
  player.key = c.slug + lang;
  clearInterval(poll);
  poll = setInterval(() => {
    try { const d = player.getDuration(), t = player.getCurrentTime(); if (d > 0 && t / d >= .9) { const k = player.getPlaylistIndex(); if (k >= 0 && !store.done(c.slug, lang, k)) markIdx(k); } } catch (e) {}
  }, 2000);
}
function stopPlayer() { clearInterval(poll); poll = null; if (player) { try { player.destroy(); } catch (e) {} player = null; } }

// ---------- routing: #course-<slug>, #course-<slug>-l3 (lesson 3), -h2 (Hindi lesson 2), or a home section
function parse() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^course-(.+?)(?:-([lh])(\d+))?$/);
  if (m && BY[m[1]]) return { c: BY[m[1]], lang: m[2] === 'h' ? 'hi' : m[2] ? 'en' : null, i: m[3] ? +m[3] - 1 : null };
  return { anchor: h };
}
function route() {
  const r = parse();
  if (!modal.hidden) closeSearch(true);
  if (r.c && cur && cur.c === r.c) { if (r.i != null) { cur.select(r.lang || cur.lang, r.i, { play: EMBED && Date.now() - lastNav < 1500, reveal: true }); if (window.innerWidth <= 1000) $('#player').scrollIntoView({ block: 'start' }); } else window.scrollTo(0, 0); return; }
  if (!r.c && !cur && $('.hero')) { const el = r.anchor && document.getElementById(r.anchor); if (el) el.scrollIntoView(); else window.scrollTo(0, 0); return; }
  const draw = () => r.c ? renderCourse(r.c, r) : renderHome(r.anchor);
  if (document.startViewTransition && !RM.matches) document.startViewTransition(draw); else draw();
}
window.addEventListener('hashchange', route);
route();
</script>
